<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/gaugeJS/dist/gauge.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<title>Smart Greenhouse</title>

<style>
body {
    font-family: Arial;
    background: #f5f5f5;
}

.container {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
}

.card {
    background: white;
    padding: 15px;
    border-radius: 10px;
	display: flex;            /* bật flex */
    flex-direction: column;   /* xếp từ trên xuống dưới */
    justify-content: center;  /* căn giữa theo chiều dọc */
    align-items: center;      /* căn giữa theo chiều ngang */
}

.row {
	background: white;
    padding: 15px;
    border-radius: 10px;
    display: flex;
    gap: 10px;
}

.sensor {
    flex: 1;
    text-align: center;
}

.value {
    font-size: 28px;
    font-weight: bold;
}

button {
    width: 80%;
    max-width: 200px;  
    padding: 14px;
    border: none;
    border-radius: 25px;
    margin: 8px auto;    /* căn giữa ngang */
    font-weight: bold;
    color: white;
    cursor: pointer;
    font-size: 16px;
    display: block;      /* để margin auto hoạt động */
}

/* OFF chung */
.off {
    background: #666 !important;
}

.control-card {
    background: white;
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 12px;
}

.control-title {
    font-size: 18px;
	font-weight: bold;
    margin-bottom: 8px;
    color: #555;
}

.control-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 30px;
    font-weight: bold;
    color: white;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
}

/* MODE */
.mode-normal { background: #9e9e9e; }
.mode-auto { background: #4caf50; }

/* LIGHT */
.light.on { background: #f45100; }
.light.off { background: #777; }

/* FAN */
.fan.on { background: #4aa3d1; }
.fan.off { background: #777; }

/* PUMP */
.pump.on { background: #2e8b00; }
.pump.off { background: #777; }

/* SPRAY */
.spray.on { background: #2f69c9; }
.spray.off { background: #777; }

.disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

img {
    width: 70%;
    border-radius: 10px;
	text-align: center;
}
canvas {
    width: 150px;
    height: 80px;
}
</style>
</head>

<body>

<h2>🌱 Smart Greenhouse Dashboard</h2>

<div class="container">

<!-- LEFT -->
<div>

<div class="row">

    <div class="sensor">
        <h4>Temperature</h4>
        <canvas id="gaugeTemp"></canvas>
        <div class="value" id="temp">--</div>
    </div>

    <div class="sensor">
        <h4>Humidity</h4>
        <canvas id="gaugeHum"></canvas>
        <div class="value" id="hum">--</div>
    </div>

    <div class="sensor">
        <h4>Soil Moisture</h4>
        <canvas id="gaugeSoil"></canvas>
        <div class="value" id="soil">--</div>
    </div>

    <div class="sensor">
        <h4>Lux</h4>
        <canvas id="gaugeLux"></canvas>
        <div class="value" id="lux">--</div>
    </div>

</div>
</br>
<div class="card">
    <h3>Camera AI</h3>
    <img id="camera" src="">
</div>

</div>

<!-- RIGHT -->
<div>

<div class="control-card">
    <div class="control-title">Mode</div>
    <button id="modeBtn" class="control-btn" onclick="toggleMode()">
        AUTO
    </button>
</div>

<div class="control-card">
    <div class="control-title">Light</div>
    <button id="lightBtn" class="control-btn light" onclick="toggle(4)">
        ON <i class="fa-solid fa-sun"></i>
    </button>
</div>

<div class="control-card">
    <div class="control-title">Fan</div>
    <button id="fanBtn" class="control-btn fan" onclick="toggle(5)">
        ON <i class="fa-solid fa-fan"></i>
    </button>
</div>

<div class="control-card">
    <div class="control-title">Pump</div>
    <button id="pumpBtn" class="control-btn pump" onclick="toggle(6)">
        OFF <i class="fa-solid fa-droplet"></i>
    </button>
</div>

<div class="control-card">
    <div class="control-title">Spray</div>
    <button id="sprayBtn" class="control-btn spray" onclick="toggle(8)">
        ON <i class="fa-solid fa-spray-can"></i>
    </button>
</div>

</div>

</div>

<script>
const TOKEN = "rtfmZLrt9StzWVDpudj46RXQiNvQKct4";
const BASE = `https://blynk.cloud/external/api`;

function createGauge(id, color) {
    let opts = {
        angle: 0,
        lineWidth: 0.2,
        radiusScale: 1,
        pointer: {
            length: 0.6,
            strokeWidth: 0.03,
            color: '#000'
        },
        staticZones: [
            {strokeStyle: color, min: 0, max: 100}
        ],
        limitMax: false,
        limitMin: false,
        highDpiSupport: true
    };

    let target = document.getElementById(id);
    let gauge = new Gauge(target).setOptions(opts);
    gauge.maxValue = 100;
    gauge.setMinValue(0);
    gauge.animationSpeed = 32;

    return gauge;
}

// tạo gauge
const gTemp = createGauge("gaugeTemp", "#ff5722");
const gHum  = createGauge("gaugeHum", "#2196f3");
const gSoil = createGauge("gaugeSoil", "#9e9e9e");
const gLux  = createGauge("gaugeLux", "#00bcd4");

let isAuto = false;

async function getValue(pin) {
    let res = await fetch(`${BASE}/get?token=${TOKEN}&V${pin}`);
    return await res.text();
}

async function setValue(pin, val) {
    await fetch(`${BASE}/update?token=${TOKEN}&V${pin}=${val}`);
}

async function updateSensors() {
    let temp = await getValue(0);
    let hum = await getValue(1);
    let soil = await getValue(2);
    let lux = await getValue(3);

    temp = parseFloat(temp);
    hum = parseFloat(hum);
    soil = parseFloat(soil);
    lux = parseFloat(lux);

    document.getElementById("temp").innerText = temp + " °C";
    document.getElementById("hum").innerText = hum + " %";
    document.getElementById("soil").innerText = soil + " %";
    document.getElementById("lux").innerText = lux + " lx";

    // update gauge
    gTemp.set(temp);
    gHum.set(hum);
    gSoil.set(soil);

    // lux scale lớn -> normalize về 0-100
    gLux.set(Math.min(lux / 10000 * 100, 100));
}

function getIcon(id) {
    return {
        lightBtn: "fa-sun",
        fanBtn: "fa-fan",
        pumpBtn: "fa-droplet",
        sprayBtn: "fa-spray-can"
    }[id];
}
function getBtnId(pin) {
    return {
        4: "lightBtn",
        5: "fanBtn",
        6: "pumpBtn",
        8: "sprayBtn"
    }[pin];
}

async function updateButtons() {
    const mapping = [
        {pin:4, id:"lightBtn"},
        {pin:5, id:"fanBtn"},
        {pin:6, id:"pumpBtn"},
        {pin:8, id:"sprayBtn"},
    ];

    for (let item of mapping) {
		let val = await getValue(item.pin);
		let btn = document.getElementById(item.id);
		let icon = getIcon(item.id);

		btn.classList.remove("on","off","disabled");

		if (val == "1") {
			btn.classList.add("on");
			btn.innerHTML = `ON <i class="fa-solid ${icon}"></i>`;
		} else {
			btn.classList.add("off");
			btn.innerHTML = `OFF <i class="fa-solid ${icon}"></i>`;
		}

		if (isAuto) {
			btn.classList.add("disabled");
			btn.disabled = true;
		} else {
			btn.disabled = false;
		}
	}

    let mode = await getValue(9);
    let modeBtn = document.getElementById("modeBtn");

    if (mode == "1") {
		modeBtn.innerHTML = 'AUTO <i class="fa-solid fa-robot"></i>';
		modeBtn.className = "control-btn mode-auto";
		isAuto = true;
	} else {
		modeBtn.innerHTML = 'NORMAL <i class="fa-solid fa-hand"></i>';
		modeBtn.className = "control-btn mode-normal";
		isAuto = false;
	}
}

async function toggle(pin) {
    if (isAuto) return; // chặn luôn

    let val = await getValue(pin);
    val = val == "1" ? 0 : 1;
    await setValue(pin, val);
    updateButtons();
}

async function toggleMode() {
    let val = await getValue(9);
    val = val == "1" ? 0 : 1;
    await setValue(9, val);
    updateButtons();
}

async function updateCamera() {
    try {
        // lấy link từ V12
        let res = await fetch(`${BASE}/get?token=${TOKEN}&V12`);
        let url = await res.text();

        // kiểm tra hợp lệ
        if (url.startsWith("http")) {
            document.getElementById("camera").src =
                url + "?t=" + new Date().getTime(); // chống cache
        }

    } catch (err) {
        console.log("Camera error:", err);
    }
}

// LOOP
setInterval(updateSensors, 2000);
setInterval(updateButtons, 2000);
setInterval(updateCamera, 2000);

</script>

</body>
</html>
